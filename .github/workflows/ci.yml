name: Checks
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: invoiceiq_ci
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: invoiceiq_test
        ports:
          - 5433:5433
        options: >-
          --health-cmd "pg_isready -U invoiceiq_ci -d invoiceiq_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      INVOICEIQ_TEST_DATABASE_URL: postgresql+psycopg://invoiceiq_ci:ci_only_password@127.0.0.1:5433/invoiceiq_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check .
      - run: python -m pytest -q
